<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        <h1>DONER INFORMATION</h1>
        <table>
            <tr>
                <td><lable for="first name">First Name*</lable></td>
                <td><input type ="text" id="first name" first name="first name" required></td>
            </tr>
            <tr>
                <td><lable for="last name">Last Nam*</lable></td>
                <td><input type ="text" id="lastst name" last name="last name" required></td>

            </tr>
            <tr>
                <td><lable for="company">Company </lable></td>
                <td><input type ="text" id="company" name="company" required></td>
            </tr>
            <tr>
                <td><lable for="address 1">Address 1*</lable></td>
                <td><input type ="number" id="address 1" address 1="address 1" required></td>

            </tr>
            <tr>
                <td><lable for="address 2">Address 2 </lable></td>
                <td><input type ="number" id="address 2" address 2="address 2" required></td>
            </tr>

            <tr>
                <td><lable for="city">City*</lable></td>
                <td><input type ="text" id="city" city="city" required></td>
            </tr>
            <tr>
                <td><lable for="state">State*</lable></td>
                <td>
                    <select name ="state" id="state">
                        <option value="null">Select a  State</option>
                        <option value=""></option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><lable for="Zip code">Zip code*</lable></td>
                <td><input type ="number" id="Zip code" first name="Zip code" required></td>
            </tr>
            <tr>
                <td><lable for="state">State*</lable></td>
                <td>
                    <select name ="state" id="state">
                    <option value="null">Select a  State</option>
                    <option value="Bangladesh"> Bangladesh</option>
                    <option value="usa"> USA</option>
                    <option value="uk"> UK</option>
                    </select>
                </td>
                
            </tr>
            <tr>
                <td><lable for="phone">Phone </lable></td>
                <td><input type ="tel" id="phone" phone="phone" required></td>
            </tr>
            <tr>
                <td><lable for="fax">Fax </lable></td>
                <td><input type ="tel" id="fax" fax="fax" required></td>

            </tr>
            <tr>

                <td><lable for="email">Email*</lable></td>
                <td><input type ="email" id="email" email="email" required></td>
            </tr>
             <tr>
                <td>
                    <label for="donation-amount"> Donation Amount* </label>
                    <h6>(Check a button or type in your amount)</h6>
                </td>
                <td>
                    <input type="radio" id="none" name="donation-amount" value="none">
                    <label for="none"> None </label>
                    <input type="radio" id="50" name="donation-amount" value="50">
                    <label for="50"> $50 </label>
                    <input type="radio" id="75" name="donation-amount" value="75">
                    <label for="75"> $75 </label>
                    <input type="radio" id="100" name="donation-amount" value="100">
                    <label for="100"> $100 </label>
                    <input type="radio" id="250" name="donation-amount" value="250">
                    <label for="250"> $250 </label>
                    <input type="radio" id="other" name="donation-amount" value="other">
                    <label for="other"> Other </label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="other-amount"> Other Amount $ </label>
                    <input type="number" id="other-amount" name="other-amount">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="recurring-donation"> Recurring Donation
                        <h6>(Check if yes)</h6>
                    </label>
                </td>
                <td>
                    <input type="checkbox" id="recurring-donation" name="recurring-donation" value="yes">
                    <label for="recurring-donation">
                        <h6>I am interested in giving on a regular basis </h6>
                    </label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="monthly-credit-card"> Monthly Credit Card $ <input type="number"> For <input
                            type="number"> Months </label>

                </td>
            </tr>

                

               
        </table>
    </form>
</body>
</html>
